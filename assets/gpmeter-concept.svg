<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
  <title id="title">gpmeter concept</title>
  <desc id="desc">Commit history from your Git branches flows into GPM, the caped Git Power Meter hero, and comes out as a reading on a power meter: a needle near max, a power score with a level, and three sub-gauges for frequency, consistency and impact.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b3a"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe680" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb020" stop-opacity="0.65"/>
      <stop offset="0.7" stop-color="#ff6a00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffa41b"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="410" y1="0" x2="505" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <linearGradient id="dial" gradientUnits="userSpaceOnUse" x1="62" y1="0" x2="258" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.4" stop-color="#2ecc9a"/>
      <stop offset="0.7" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Section labels -->
    <text x="70" y="70" fill="#8ea2d8" font-size="15" font-weight="600" letter-spacing="2">YOUR COMMITS</text>
    <text x="600" y="70" fill="#ffcf6b" font-size="15" font-weight="600" letter-spacing="2" text-anchor="middle">GIT POWER METER</text>
    <text x="840" y="70" fill="#8ea2d8" font-size="15" font-weight="600" letter-spacing="2">YOUR POWER READING</text>

    <!-- ===== Left: commit graph ===== -->
    <g stroke-width="4" fill="none" stroke-linecap="round">
      <!-- main -->
      <path d="M70 260 H400" stroke="#4f8cff"/>
      <!-- feature branch -->
      <path d="M110 260 C140 260 140 170 175 170 H300 C335 170 335 260 365 260" stroke="#2ecc9a"/>
      <!-- fix branch -->
      <path d="M150 260 C180 260 180 350 215 350 H280 C315 350 315 260 340 260" stroke="#c77dff"/>
    </g>
    <g stroke="#0b1020" stroke-width="3">
      <circle cx="70" cy="260" r="10" fill="#4f8cff"/>
      <circle cx="110" cy="260" r="10" fill="#4f8cff"/>
      <circle cx="150" cy="260" r="10" fill="#4f8cff"/>
      <circle cx="250" cy="260" r="10" fill="#4f8cff"/>
      <circle cx="340" cy="260" r="10" fill="#4f8cff"/>
      <circle cx="365" cy="260" r="10" fill="#4f8cff"/>
      <circle cx="200" cy="170" r="10" fill="#2ecc9a"/>
      <circle cx="245" cy="170" r="10" fill="#2ecc9a"/>
      <circle cx="290" cy="170" r="10" fill="#2ecc9a"/>
      <circle cx="235" cy="350" r="10" fill="#c77dff"/>
      <circle cx="270" cy="350" r="10" fill="#c77dff"/>
    </g>
    <text x="200" y="145" fill="#2ecc9a" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature/*</text>
    <text x="210" y="385" fill="#c77dff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fix/*</text>
    <text x="70" y="292" fill="#4f8cff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">main</text>

    <!-- Contribution heatmap -->
    <g transform="translate(70 425)">
      <g fill="#2ecc9a">
        <rect x="0"   y="0" width="16" height="16" rx="3" opacity="0.15"/>
        <rect x="20"  y="0" width="16" height="16" rx="3" opacity="0.45"/>
        <rect x="40"  y="0" width="16" height="16" rx="3" opacity="0.8"/>
        <rect x="60"  y="0" width="16" height="16" rx="3" opacity="0.3"/>
        <rect x="80"  y="0" width="16" height="16" rx="3" opacity="1"/>
        <rect x="100" y="0" width="16" height="16" rx="3" opacity="0.6"/>
        <rect x="120" y="0" width="16" height="16" rx="3" opacity="0.15"/>
        <rect x="140" y="0" width="16" height="16" rx="3" opacity="0.9"/>
        <rect x="160" y="0" width="16" height="16" rx="3" opacity="0.5"/>
        <rect x="180" y="0" width="16" height="16" rx="3" opacity="1"/>
        <rect x="200" y="0" width="16" height="16" rx="3" opacity="0.7"/>
        <rect x="220" y="0" width="16" height="16" rx="3" opacity="0.35"/>
        <rect x="240" y="0" width="16" height="16" rx="3" opacity="0.95"/>
        <rect x="260" y="0" width="16" height="16" rx="3" opacity="0.6"/>
        <rect x="280" y="0" width="16" height="16" rx="3" opacity="1"/>
        <rect x="300" y="0" width="16" height="16" rx="3" opacity="0.8"/>
      </g>
      <text x="0" y="40" fill="#8ea2d8" font-size="13">commit history · daily activity</text>
    </g>

    <!-- ===== Flow into core ===== -->
    <path d="M410 260 C450 260 470 260 505 260" stroke="url(#flow)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M410 260 C450 260 470 260 505 260" stroke="#fff3b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 14">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- ===== Center: power core ===== -->
    <circle cx="600" cy="260" r="150" fill="url(#coreGlow)">
      <animate attributeName="r" values="140;158;140" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="260" r="130" fill="none" stroke="#ffcf6b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0 600 260" to="360 600 260" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- GPM, the gpmeter hero (original character) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- cape -->
      <path d="M566 182 C528 236 510 330 482 400 Q540 382 600 392 Q660 382 718 400 C690 330 672 236 634 182 Z" fill="#ff7a1a"/>
      <path d="M600 190 C596 270 596 330 600 392 Q660 382 718 400 C690 330 672 236 634 182 Z" fill="#e8590c"/>
      <!-- legs and boots -->
      <path d="M572 286 L566 382 H594 L599 286 Z" fill="#5a3fd6"/>
      <path d="M601 286 L606 382 H634 L628 286 Z" fill="#5a3fd6"/>
      <path d="M567 352 H594 L594 384 Q580 392 560 386 Z" fill="#ffb020"/>
      <path d="M606 352 H633 L640 386 Q620 392 606 384 Z" fill="#ffb020"/>
      <!-- right arm on hip -->
      <path d="M632 194 L662 238 L634 266" fill="none" stroke="#6c4cff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="634" cy="266" r="11" fill="#ffb020"/>
      <!-- torso -->
      <path d="M564 186 Q600 172 636 186 L630 292 H570 Z" fill="#6c4cff"/>
      <rect x="568" y="274" width="64" height="13" rx="4" fill="#ffb020"/>
      <rect x="592" y="272" width="16" height="17" rx="3" fill="#fff3b0"/>
      <!-- left arm raised with fist -->
      <path d="M568 194 L540 148 L532 108" fill="none" stroke="#6c4cff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="531" cy="100" r="14" fill="#ffb020"/>
      <!-- chest emblem: git branch -->
      <circle cx="600" cy="224" r="24" fill="#ffcf6b" stroke="#fff3b0" stroke-width="3"/>
      <g stroke="#1a1f3d" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M592 210 V238"/>
        <path d="M608 214 C608 226 592 222 592 232"/>
      </g>
      <g fill="#1a1f3d">
        <circle cx="592" cy="210" r="4"/>
        <circle cx="592" cy="238" r="4"/>
        <circle cx="608" cy="214" r="4"/>
      </g>
      <!-- neck and head -->
      <rect x="592" y="166" width="16" height="16" fill="#f2c39c"/>
      <circle cx="600" cy="142" r="30" fill="#ffd7b5"/>
      <path d="M570 140 C568 112 590 104 604 106 C624 106 634 120 631 138 C622 124 606 120 590 126 C582 130 576 134 570 140 Z" fill="#2b2d55"/>
      <!-- domino mask -->
      <path d="M572 140 Q600 130 628 140 L626 154 Q614 158 600 150 Q586 158 574 154 Z" fill="#6c4cff"/>
      <ellipse cx="587" cy="146" rx="6" ry="4" fill="#ffffff"/>
      <ellipse cx="613" cy="146" rx="6" ry="4" fill="#ffffff"/>
      <path d="M591 160 Q600 167 609 160" fill="none" stroke="#7a3b2e" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="600" y="432" fill="#ffcf6b" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">GPM</text>
    <text x="600" y="458" fill="#c9d4f5" font-size="14" text-anchor="middle">Git Power Meter · reads .git locally</text>

    <!-- Flow out -->
    <path d="M695 260 H790" stroke="#ffb020" stroke-width="10" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M778 246 L800 260 L778 274" fill="none" stroke="#ffb020" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ===== Right: power meter ===== -->
    <g transform="translate(830 110)">
      <rect width="320" height="300" rx="18" fill="#1b2350" stroke="#ffcf6b" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="160" y="40" fill="#8ea2d8" font-size="14" font-weight="600" letter-spacing="1.5" text-anchor="middle">POWER METER</text>

      <!-- dial -->
      <path d="M62 168 A98 98 0 0 1 258 168" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="18" stroke-linecap="round"/>
      <path d="M62 168 A98 98 0 0 1 258 168" fill="none" stroke="url(#dial)" stroke-width="12" stroke-linecap="round"/>
      <g stroke="#c9d4f5" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
        <line x1="84.0" y1="168.0" x2="73.0" y2="168.0" stroke-width="3"/>
        <line x1="80.0" y1="155.3" x2="74.1" y2="154.4"/>
        <line x1="83.0" y1="143.0" x2="77.3" y2="141.1"/>
        <line x1="87.8" y1="131.2" x2="82.5" y2="128.5"/>
        <line x1="94.5" y1="120.4" x2="89.6" y2="116.9"/>
        <line x1="106.3" y1="114.3" x2="98.5" y2="106.5" stroke-width="3"/>
        <line x1="112.4" y1="102.5" x2="108.9" y2="97.6"/>
        <line x1="123.2" y1="95.8" x2="120.5" y2="90.5"/>
        <line x1="135.0" y1="91.0" x2="133.1" y2="85.3"/>
        <line x1="147.3" y1="88.0" x2="146.4" y2="82.1"/>
        <line x1="160.0" y1="92.0" x2="160.0" y2="81.0" stroke-width="3"/>
        <line x1="172.7" y1="88.0" x2="173.6" y2="82.1"/>
        <line x1="185.0" y1="91.0" x2="186.9" y2="85.3"/>
        <line x1="196.8" y1="95.8" x2="199.5" y2="90.5"/>
        <line x1="207.6" y1="102.5" x2="211.1" y2="97.6"/>
        <line x1="213.7" y1="114.3" x2="221.5" y2="106.5" stroke-width="3"/>
        <line x1="225.5" y1="120.4" x2="230.4" y2="116.9"/>
        <line x1="232.2" y1="131.2" x2="237.5" y2="128.5"/>
        <line x1="237.0" y1="143.0" x2="242.7" y2="141.1"/>
        <line x1="240.0" y1="155.3" x2="245.9" y2="154.4"/>
        <line x1="236.0" y1="168.0" x2="247.0" y2="168.0" stroke-width="3"/>
      </g>
      <text x="62" y="192" fill="#8ea2d8" font-size="11" font-weight="600" text-anchor="middle">LOW</text>
      <text x="258" y="192" fill="#ff5e3a" font-size="11" font-weight="700" text-anchor="middle">MAX</text>

      <!-- needle: sweeps up once, then trembles at the reading -->
      <g transform="rotate(63 160 168)">
        <animateTransform attributeName="transform" type="rotate" values="-90 160 168;69 160 168;63 160 168" keyTimes="0;0.7;1" dur="1.6s" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 160 168;-2 160 168;1.5 160 168;0 160 168" dur="0.9s" begin="1.6s" repeatCount="indefinite"/>
          <path d="M155 168 L160 88 L165 168 Z" fill="#fff3b0"/>
        </g>
      </g>
      <circle cx="160" cy="168" r="11" fill="#ffcf6b" stroke="#1b2350" stroke-width="3"/>

      <text x="160" y="216" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle">9,001 <tspan fill="#ffcf6b" font-size="17" font-weight="700">⚡ Lv.42</tspan></text>

      <!-- sub-gauges -->
      <g font-size="12" fill="#c9d4f5" text-anchor="middle">
        <text x="56" y="256">Frequency</text>
        <rect x="20" y="266" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect x="20" y="266" width="63" height="8" rx="4" fill="url(#bar)"/>
        <text x="160" y="256">Consistency</text>
        <rect x="124" y="266" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect x="124" y="266" width="53" height="8" rx="4" fill="url(#bar)"/>
        <text x="264" y="256">Impact</text>
        <rect x="228" y="266" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
        <rect x="228" y="266" width="68" height="8" rx="4" fill="url(#bar)"/>
      </g>
    </g>

    <text x="990" y="455" fill="#c9d4f5" font-size="14" text-anchor="middle">your development power, on the meter</text>
  </g>
</svg>
