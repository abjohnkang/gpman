  <path d="M572 140 Q600 130 628 140 L626 154 Q614 158 600 150 Q586 158 574 154 Z" fill="#6c4cff"/>
  <g class="eyes"><ellipse cx="587" cy="146" rx="6" ry="4" fill="#ffffff"/><ellipse cx="613" cy="146" rx="6" ry="4" fill="#ffffff"/></g>
  <path d="M588 157 Q600 174 612 157 Z" fill="#7a3b2e"/><path d="M591 158 H609 L607 162 H593 Z" fill="#ffffff"/>
  </g></g>
  
  <text x="200" y="378" fill="#ffcf6b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">Level up!</text>
