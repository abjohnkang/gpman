  <text x="200" y="378" fill="#ffcf6b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">Oops! Merge conflict</text>
